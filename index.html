<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Bridge features this page needs from the Android app (see WebUpdater.NATIVE_API). -->
<meta name="margingo-native-api" content="1">
<meta name="theme-color" content="#0f1512">
<title>MarginGo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0f1512; --panel:#172019; --panel2:#1e2a22; --line:#2a382f; --text:#e8f0ea; --muted:#8fa396;
  --accent:#3fd68b; --accent-ink:#06210f;
  --red:#ff6b6b; --orange:#ffa94d; --yellow:#ffd43b; --green:#51cf66;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px}
header h1 span{color:var(--accent)}
header .cash{font-size:13px;color:var(--muted);text-align:right}
header .cash b{display:block;color:var(--accent);font-size:16px}
main{padding:12px 16px;max-width:760px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;color:var(--muted);font-size:14px}
.seg button.on{background:var(--panel2);color:var(--text);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;white-space:nowrap;color:var(--muted);font-size:13.5px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input,.tools select{flex:1;min-width:0}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:9px}
.item{border-left:5px solid var(--line);cursor:pointer}
.item.c-red{border-left-color:var(--red)} .item.c-orange{border-left-color:var(--orange)}
.item.c-yellow{border-left-color:var(--yellow)} .item.c-green{border-left-color:var(--green)}
.item .r1{display:flex;gap:8px;align-items:flex-start}
.item .r1 b{flex:1;font-size:15.5px;word-break:break-word}
.item .r2{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .r3{margin-top:6px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.badge{font-weight:700;border-radius:8px;padding:2px 8px;font-size:14px;white-space:nowrap}
.b-red{background:rgba(255,107,107,.16);color:var(--red)} .b-orange{background:rgba(255,169,77,.16);color:var(--orange)}
.b-yellow{background:rgba(255,212,59,.14);color:var(--yellow)} .b-green{background:rgba(81,207,102,.16);color:var(--green)}
.pill{border-radius:6px;padding:1px 7px;background:var(--panel2);color:var(--text);font-size:11.5px}
.pos{color:var(--green)} .neg{color:var(--red)} .muted{color:var(--muted)}
.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--panel2);color:var(--text);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:rgba(255,107,107,.14);color:var(--red)}
.btn.small{padding:7px 11px;font-size:13.5px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty p{max-width:420px;margin:0 auto 14px}
.big{font-size:30px;font-weight:750;letter-spacing:-.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.kpis .card{margin:0}
.kpi-l{font-size:12.5px;color:var(--muted)} .kpi-v{font-size:19px;font-weight:700;margin-top:2px}
h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.list-row:last-child{border-bottom:0}
.list-row .l{flex:1;min-width:0}
.list-row .l small{display:block;color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.neg{background:var(--red)}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:2px 6px}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:none;max-width:760px;margin:0 auto}
#sheet.open,#veil.open{display:block}
#sheet h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
#sheet h3 span{flex:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.facts div{background:var(--panel);border-radius:10px;padding:8px 10px}
.facts small{display:block;color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;z-index:30;display:none;max-width:90vw;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-2px 0 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:0}
a{color:var(--accent)}
.sp{height:10px}
</style>
</head>
<body>
<div id="mg-app">
  <header>
    <h1>Margin<span>Go</span></h1>
    <div class="cash" data-a="tab" data-id="cash"><span id="hdrCashL"></span><b id="hdrCash"></b></div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" data-a="newItem" aria-label="+">+</button>
  <nav id="nav"></nav>
</div>
<div id="veil" data-a="closeSheet"></div>
<div id="sheet" role="dialog"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>

const LOCALE = {sr:'sr-RS', en:'en-GB', nb:'nb-NO'};
function t(k, vars){
  let s = (I18N[D.lang] || I18N.sr)[k] ?? I18N.en[k] ?? k;
  if(vars) for(const v in vars) s = s.replace('{'+v+'}', vars[v]);

/* ================= data ================= */
const KEY = 'margingo';
const CURS = ['NOK','EUR','RSD','SEK','DKK','USD','GBP','PLN','BAM','HUF','CHF'];
// Approximate kr per unit, used only until the first download.
const DEF_RATES = {NOK:1,EUR:11.7,RSD:0.1,SEK:0.98,DKK:1.57,USD:10.3,GBP:13.8,PLN:2.75,BAM:6,HUF:0.029,CHF:12.5};
const OPEN = ['bought','transit','listed'];

function blank(){
  return {
    v:1, lang:'sr', th:[0,20,50],
    cats:['tech','collect','clothes','furniture','sport','other'].map(k => ({id:k, key:'cat.'+k})),
    purposes:[{id:'reinvest', key:'p.reinvest'}, {id:'trip', key:'p.trip'}, {id:'fun', key:'p.fun'}, {id:'save', key:'p.save'}],
    items:[], trips:[], ledger:[],
    rates:{...DEF_RATES}, ratesAt:0, manual:{},
    ui:{tab:'items', scope:'all', filter:'active', sort:'roi', cat:'', q:''}
  };
}
function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  return normalize(d);
}
function normalize(d){
  const b = blank();
  if(!d || typeof d !== 'object' || !Array.isArray(d.items)) return b;
  const out = Object.assign(b, d);
  out.ui = Object.assign(blank().ui, d.ui || {});
  out.rates = Object.assign({...DEF_RATES}, d.rates || {});
  out.manual = d.manual || {};
  for(const it of out.items){ it.sales = it.sales || []; it.qty = Math.max(1, +it.qty || 1); }
  return out;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch(e){ toast('localStorage: ' + e.message); }
}
let D = load();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? n : 0; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr, id) => arr.find(x => x.id === id);

/* ================= money ================= */
function rate(cur){ return cur === 'NOK' ? 1 : (+D.manual[cur] || +D.rates[cur] || DEF_RATES[cur] || 1); }
function fmtNum(n, dec){
  return new Intl.NumberFormat(LOCALE[D.lang] || 'sr-RS', {maximumFractionDigits:dec, minimumFractionDigits:0}).format(n);
}
function kr(n){ return fmtNum(Math.round(n), 0) + ' kr'; }
function money(n, cur){ return cur === 'NOK' ? kr(n) : fmtNum(n, Math.abs(n) < 100 ? 2 : 0) + ' ' + cur; }
function signed(n){ return (n > 0.5 ? '+' : '') + kr(n); }
function pct(p){ return p === Infinity ? '∞' : (p > 0 ? '+' : '') + fmtNum(Math.round(p), 0) + '%'; }
function colorOf(p){
  const [o, y, g] = D.th;
  if(p === Infinity || p >= g) return 'green';
  if(p >= y) return 'yellow';
  if(p >= o) return 'orange';
  return 'red';
}

/* Per unit, in kr. The purchase rate is frozen when the item is bought; before that it follows today's rate. */
function unitCost(it){ return num(it.buyPrice) * (it.status === 'watch' || !it.buyRate ? rate(it.buyCur) : it.buyRate); }
function unitExtra(it){ return num(it.costs) / (it.qty || 1); }
function unitBase(it){ return unitCost(it) + unitExtra(it); }
function unitEst(it){ return num(it.estSell) * rate(it.sellCur); }
function soldQty(it){ return it.sales.reduce((s, x) => s + x.qty, 0); }
function leftQty(it){ return Math.max(0, it.qty - soldQty(it)); }
function saleProfit(it, s){ return s.nok - s.qty * unitBase(it) - (s.fee || 0); }
function saleBase(it, s){ return s.qty * unitBase(it) + (s.fee || 0); }
function roi(profit, base){ return base > 0.005 ? profit / base * 100 : (profit > 0 ? Infinity : 0); }
function isDone(it){ return it.status === 'sold' || it.status === 'writeoff'; }

/* What the list shows: realised numbers for finished items, expected ones otherwise. */
function itemView(it){
  if(isDone(it)){
    let p = 0, b = 0;
    for(const s of it.sales){ p += saleProfit(it, s); b += saleBase(it, s); }
    return {profit:p, roi:roi(p, b), real:true};
  }
  const p = unitEst(it) - unitBase(it);
  return {profit:p * (it.status === 'watch' ? it.qty : leftQty(it)), unit:p, roi:roi(p, unitBase(it)), real:false};
}
function refreshStatus(it){
  if(leftQty(it) === 0 && it.sales.length) it.status = it.sales.every(s => s.w) ? 'writeoff' : 'sold';
  else if(isDone(it)) it.status = 'listed';
}

function totals(){
  let profit = 0, goods = 0, sold = 0;
  for(const it of D.items){
    for(const s of it.sales){ profit += saleProfit(it, s); if(!s.w) sold += s.qty; }
    if(it.status !== 'watch') goods += leftQty(it) * unitBase(it);
  }
  const L = {capIn:0, capOut:0, withdraw:0, reinvest:0};
  for(const e of D.ledger) L[e.t] = (L[e.t] || 0) + e.amt;
  return {
    profit, goods, sold,
    box: profit - L.withdraw - L.reinvest,
    free: L.capIn - L.capOut + L.reinvest - goods,
    capital: L.capIn - L.capOut + L.reinvest
  };
}

/* ================= labels ================= */
const catName = id => { const c = byId(D.cats, id); return c ? (c.key ? t(c.key) : c.name) : '—'; };
const purposeName = id => { const p = byId(D.purposes, id); return p ? (p.key ? t(p.key) : p.name) : '—'; };

/* ---------- items ---------- */
function filtered(){
  const u = D.ui, q = u.q.trim().toLowerCase();
  let list = D.items.filter(it => {
    if(u.scope === 'local' && it.tripId) return false;
    if(u.scope === 'trip' && !it.tripId) return false;
    if(u.cat && it.cat !== u.cat) return false;
    if(u.filter === 'active' && isDone(it)) return false;
    if(u.filter === 'watch' && it.status !== 'watch') return false;
    if(u.filter === 'stock' && !OPEN.includes(it.status)) return false;
    if(u.filter === 'done' && !isDone(it)) return false;
    if(q && !(it.name + ' ' + (it.note || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  const V = new Map(list.map(it => [it, itemView(it)]));
  const cmp = {
    roi: (a, b) => (V.get(b).roi === V.get(a).roi ? 0 : V.get(b).roi > V.get(a).roi ? 1 : -1),
    profit: (a, b) => V.get(b).profit - V.get(a).profit,
    new: (a, b) => (b.created || '').localeCompare(a.created || '') || b.id.localeCompare(a.id),
    name: (a, b) => a.name.localeCompare(b.name)
  }[u.sort];
  return list.sort(cmp).map(it => [it, V.get(it)]);
}
function itemCard(it, v){
  const c = colorOf(v.roi), trip = tripOf(it);
  const left = leftQty(it);
  const qtyTxt = it.qty > 1 ? (isDone(it) || !it.sales.length ? ` ×${it.qty}` : ` · ${t('soldOf', {a:soldQty(it), b:it.qty})}`) : '';
  const costTxt = num(it.buyPrice) === 0 ? t('free') : money(num(it.buyPrice), it.buyCur);
  return `<div class="card item c-${c}" data-a="openItem" data-id="${it.id}">
    <div class="r1"><b>${esc(it.name)}</b><span class="badge b-${c}">${pct(v.roi)}</span></div>
    <div class="r2"><span class="pill">${esc(t('st.' + it.status))}</span><span>${esc(catName(it.cat))}${trip ? ' · ' + esc(trip.name) : ''}${qtyTxt}</span></div>
    <div class="r3"><span class="muted">${costTxt} → ${v.real ? '' : '~'}${money(num(it.estSell), it.sellCur)}</span>
      <span class="${v.profit >= 0 ? 'pos' : 'neg'}"><b>${signed(v.profit)}</b></span>${!v.real && left !== it.qty && it.status !== 'watch' ? `<span class="muted">${left} ${t('left')}</span>` : ''}</div>
  </div>`;
}
function viewItems(){
  const u = D.ui;
  const seg = ['all','local','trip'].map(s => `<button data-a="scope" data-id="${s}" class="${u.scope === s ? 'on' : ''}">${t('scope.' + s)}</button>`).join('');
  const chips = ['active','watch','stock','done','all'].map(f => `<button class="chip ${u.filter === f ? 'on' : ''}" data-a="filter" data-id="${f}">${t('f.' + f)}</button>`).join('');
  const th = D.th;
  return `<div class="seg">${seg}</div>
    <div class="chips">${chips}</div>
    <div class="tools">
      <input id="q" type="search" placeholder="${esc(t('search'))}" value="${esc(u.q)}">
      <select id="sort">${['roi','profit','new','name'].map(s => `<option value="${s}" ${u.sort === s ? 'selected' : ''}>${esc(t('sort.' + s))}</option>`).join('')}</select>
    </div>
    <div class="tools"><select id="catF"><option value="">${esc(t('allCats'))}</option>${D.cats.map(c => `<option value="${c.id}" ${u.cat === c.id ? 'selected' : ''}>${esc(catName(c.id))}</option>`).join('')}</select></div>
    ${D.items.length ? `<div class="legend">${esc(t('legend'))}: <span><i style="background:var(--red)"></i>&lt;${th[0]}%</span><span><i style="background:var(--orange)"></i>${th[0]}–${th[1]}%</span><span><i style="background:var(--yellow)"></i>${th[1]}–${th[2]}%</span><span><i style="background:var(--green)"></i>${th[2]}%+</span></div>` : ''}
    <div id="itemList">${itemListHtml()}</div>`;
}
function itemListHtml(){
  if(!D.items.length) return `<div class="empty"><p>${esc(t('empty.items'))}</p><button class="btn pri" data-a="newItem">+ ${esc(t('addItem'))}</button></div>`;
  const list = filtered();
  if(!list.length) return `<div class="empty"><p>${esc(t('empty.filter'))}</p></div>`;
  return list.map(([it, v]) => itemCard(it, v)).join('');
}

    <label>${t('note')}</label><textarea id="fNote">${esc(it.note)}</textarea>
    <div class="sp"></div>
    <div class="row"><button class="btn" data-a="closeSheet">${t('cancel')}</button><button class="btn pri" id="fSave">${t('save')}</button></div>`);

  const $ = id => document.getElementById(id);
  const calc = () => {
    const bc = $('fBuyCur').value, sc = $('fSellCur').value;
    const b = num($('fBuy').value) * rate(bc), e = num($('fEst').value) * rate(sc);
    const base = b + num($('fCosts').value) / Math.max(1, num($('fQty').value) || 1);
    const p = e - base;
    $('fCalc').innerHTML = $('fEst').value.trim() ? `${t('estProfit')}: <b class="${p >= 0 ? 'pos' : 'neg'}">${signed(p)}</b> ${t('each')} · <b>${pct(roi(p, base))}</b>${bc !== 'NOK' || sc !== 'NOK' ? ` <span class="muted">(${kr(b)} → ${kr(e)})</span>` : ''}` : '';
  };
  ['fBuy','fEst','fCosts','fQty','fBuyCur','fSellCur'].forEach(id => $(id).addEventListener('input', calc));
  $('fTrip').addEventListener('change', () => {
    const tr = byId(D.trips, $('fTrip').value);
    $('curRow').style.display = tr ? '' : 'none';
    if(tr){ $('fBuyCur').value = tr.buyCur; $('fSellCur').value = tr.sellCur; }
    else { $('fBuyCur').value = 'NOK'; $('fSellCur').value = 'NOK'; }
    calc();
  });
  calc();
  if(isNew && !it.name) setTimeout(() => $('fName').focus(), 50);

  $('fSave').onclick = () => {
    const name = $('fName').value.trim();
    if(!name){ toast(t('required')); $('fName').focus(); return; }
    const target = isNew ? {id:uid(), created:today(), sales:[], status:'watch'} : it;
    const oldCur = target.buyCur;
    Object.assign(target, {
      name, cat:$('fCat').value, tripId:$('fTrip').value || '',
      buyCur:$('fBuyCur').value, sellCur:$('fSellCur').value,
      buyPrice:num($('fBuy').value), estSell:num($('fEst').value), costs:num($('fCosts').value),
      qty:Math.max(1, Math.round(num($('fQty').value)) || 1, soldQty(target)),
      link:$('fLink').value.trim(), note:$('fNote').value.trim()
    });
    if(!isDone(target)) setStatus(target, $('fStatus').value);
    // The purchase rate is frozen once bought; a changed purchase currency takes today's rate.
    if(target.status !== 'watch' && (!target.buyRate || oldCur !== target.buyCur)) target.buyRate = rate(target.buyCur);
    refreshStatus(target);
    if(isNew) D.items.push(target);
    save(); closeSheet(); render(); toast(t('saved'));
  };
}
function setStatus(it, st){
  if(st !== 'watch' && it.status === 'watch'){ it.buyRate = rate(it.buyCur); it.bought = it.bought || today(); }
  if(st === 'watch'){ it.buyRate = 0; it.bought = ''; }
  it.status = st;
}

/* ---------- item details ---------- */
function openItem(id){
  const it = byId(D.items, id); if(!it) return;
  const v = itemView(it), trip = tripOf(it), done = isDone(it);
  const acts = [];
  if(it.status === 'watch') acts.push(['st', 'bought', 'act.bought']);
  if(it.status === 'bought' && it.tripId) acts.push(['st', 'transit', 'act.transit']);
  if(it.status === 'bought' || it.status === 'transit') acts.push(['st', 'listed', 'act.listed']);
  if(!done && it.status !== 'watch') acts.push(['sell', '', 'act.sell']);
  if(it.status === 'watch') acts.push(['sell', '', 'act.sell']);
  const sales = it.sales.slice().sort((a, b) => b.d.localeCompare(a.d)).map(s => {
    const p = saleProfit(it, s);
    return `<div class="list-row"><div class="l">${s.w ? t('h.writeoff') : money(s.price, s.cur)} · ${s.qty}×<small>${s.d}${s.fee ? ' · −' + kr(s.fee) : ''}</small></div>
      <b class="${p >= 0 ? 'pos' : 'neg'}">${signed(p)}</b><button class="x" data-a="delSale" data-id="${it.id}|${s.id}">✕</button></div>`;

  openSheet(`<h3><span>${esc(it.name)}</span><button class="x" data-a="closeSheet">✕</button></h3>

    <div class="facts">
      <div><small>${t('cost')} (${t('each')})</small>${num(it.buyPrice) === 0 ? t('free') : money(num(it.buyPrice), it.buyCur)}${it.buyCur !== 'NOK' ? `<small>= ${kr(unitCost(it))}</small>` : ''}</div>
      <div><small>${t('est')} (${t('each')})</small>${money(num(it.estSell), it.sellCur)}${it.sellCur !== 'NOK' ? `<small>= ${kr(unitEst(it))}</small>` : ''}</div>
      <div><small>${t(v.real ? 'realProfit' : 'estProfit')}</small><b class="${v.profit >= 0 ? 'pos' : 'neg'}">${signed(v.profit)}</b></div>
      <div><small>%</small><span class="badge b-${colorOf(v.roi)}">${pct(v.roi)}</span></div>
      ${it.qty > 1 || it.sales.length ? `<div><small>${t('qty')}</small>${t('soldOf', {a:soldQty(it), b:it.qty})}</div>` : ''}
      ${num(it.costs) ? `<div><small>${t('costs')}</small>${kr(num(it.costs))}</div>` : ''}
    </div>
    ${it.note ? `<p style="white-space:pre-wrap">${esc(it.note)}</p>` : ''}

    ${sales ? `<h2>${t('sales')}</h2><div class="card">${sales}</div>` : ''}

      <button class="btn" data-a="editItem" data-id="${it.id}">${t('edit')}</button>
      ${!done && it.status !== 'watch' ? `<button class="btn" data-a="writeoff" data-id="${it.id}">${t('act.writeoff')}</button>` : ''}
      <button class="btn danger" data-a="delItem" data-id="${it.id}">${t('delete')}</button>
    </div>
    <p class="hint">${t('added')}: ${esc(it.created || '')}${it.bought ? ' · ' + t('st.bought') + ': ' + esc(it.bought) : ''}</p>`);
}
function safeUrl(u){ return /^https?:\/\//i.test(u) ? u : 'https://' + u; }

function sellForm(id, writeoff){
  const it = byId(D.items, id); if(!it) return;
  const left = Math.max(1, leftQty(it));
  openSheet(`<h3><span>${t(writeoff ? 'woTitle' : 'sellTitle')}: ${esc(it.name)}</span><button class="x" data-a="closeSheet">✕</button></h3>
    ${writeoff ? `<p class="hint">${esc(t('woText'))}</p>` : ''}
    <div class="grid2">
      <div><label>${t(writeoff ? 'woQty' : 'sellQty')}</label><input id="sQty" inputmode="numeric" value="${left}"></div>
      <div><label>${t('date')}</label><input id="sDate" type="date" value="${today()}"></div>
    </div>
    ${writeoff ? '' : `<div class="grid2">
      <div><label>${t('sellPrice')}</label><input id="sPrice" inputmode="decimal" value="${num(it.estSell) * left || ''}"></div>

    const qty = Math.min(left, Math.max(1, Math.round(num($('sQty').value)) || 1));
    const price = writeoff ? 0 : num($('sPrice').value), cur = writeoff ? 'NOK' : $('sCur').value;
    const s = {id:uid(), d:$('sDate').value || today(), qty, price, cur, rate:rate(cur), nok:price * rate(cur), fee:writeoff ? 0 : num($('sFee').value), w:!!writeoff};
    return s;
  };
  const calc = () => {
    const s = read(), p = saleProfit(it, s);

    if(it.status === 'watch') setStatus(it, 'bought');

}

/* ---------- trips ---------- */
function tripStats(tr){
  let profit = 0, est = 0;
  for(const it of D.items) if(it.tripId === tr.id){
    for(const s of it.sales) profit += saleProfit(it, s);
    if(!isDone(it)) est += (unitEst(it) - unitBase(it)) * leftQty(it);
  }
  return {profit, est, cov: tr.cost > 0 ? profit / tr.cost * 100 : null};
}

  if(!D.trips.length) return `<div class="empty"><p>${esc(t('empty.trips'))}</p><button class="btn pri" data-a="newTrip">+ ${esc(t('tripNew'))}</button></div>`;

function moneyForm(kind){
  const T = totals();

/* ---------- stats ---------- */
function viewStats(T){
  const sales = [];
  for(const it of D.items) for(const s of it.sales) sales.push({it, s, p:saleProfit(it, s), b:saleBase(it, s)});
  if(!sales.length) return `<div class="empty"><p>${esc(t('stats.none'))}</p></div>`;
  const P = sales.reduce((a, x) => a + x.p, 0), B = sales.reduce((a, x) => a + x.b, 0);
  const days = sales.filter(x => !x.s.w && x.it.bought).map(x => Math.max(0, (new Date(x.s.d) - new Date(x.it.bought)) / 864e5));
  const avgDays = days.length ? days.reduce((a, b) => a + b, 0) / days.length : null;
  const byCat = {};
  for(const x of sales){ const c = byCat[x.it.cat] || (byCat[x.it.cat] = {p:0, n:0}); c.p += x.p; if(!x.s.w) c.n += x.s.qty; }
  const catRows = Object.entries(byCat).sort((a, b) => b[1].p - a[1].p);
  const maxCat = Math.max(1, ...catRows.map(r => Math.abs(r[1].p)));
  const months = {};
  for(const x of sales){ const m = x.s.d.slice(0, 7); months[m] = (months[m] || 0) + x.p; }
  const mRows = Object.entries(months).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 12);
  const maxM = Math.max(1, ...mRows.map(r => Math.abs(r[1])));
  const byP = {};
  for(const e of D.ledger) if(e.t === 'withdraw' || e.t === 'reinvest'){ const k = e.t === 'reinvest' ? 'reinvest' : e.p; byP[k] = (byP[k] || 0) + e.amt; }
  const best = sales.filter(x => !x.s.w).sort((a, b) => b.p - a.p).slice(0, 5);
  const bar = (v, max) => `<div class="bar"><i class="${v < 0 ? 'neg' : ''}" style="width:${Math.abs(v) / max * 100}%"></i></div>`;
  return `<div class="kpis">
      <div class="card"><div class="kpi-l">${t('cash.total')}</div><div class="kpi-v ${P >= 0 ? 'pos' : 'neg'}">${kr(P)}</div></div>
      <div class="card"><div class="kpi-l">${t('stats.avgRoi')}</div><div class="kpi-v">${pct(roi(P, B))}</div></div>
      <div class="card"><div class="kpi-l">${t('stats.sold')}</div><div class="kpi-v">${T.sold}</div></div>
      <div class="card"><div class="kpi-l">${t('stats.days')}</div><div class="kpi-v">${avgDays === null ? '—' : fmtNum(Math.round(avgDays), 0)}</div></div>
    </div>
    <h2>${t('stats.byMonth')}</h2><div class="card">${mRows.map(([m, v]) => `<div class="list-row"><div class="l">${m}${bar(v, maxM)}</div><b class="${v >= 0 ? 'pos' : 'neg'}">${signed(v)}</b></div>`).join('')}</div>
    <h2>${t('stats.byCat')}</h2><div class="card">${catRows.map(([c, v]) => `<div class="list-row"><div class="l">${esc(catName(c))} <span class="muted">· ${v.n}×</span>${bar(v.p, maxCat)}</div><b class="${v.p >= 0 ? 'pos' : 'neg'}">${signed(v.p)}</b></div>`).join('')}</div>
    ${Object.keys(byP).length ? `<h2>${t('stats.byPurpose')}</h2><div class="card">${Object.entries(byP).sort((a, b) => b[1] - a[1]).map(([p, v]) => `<div class="list-row"><div class="l">${esc(purposeName(p))}</div><b>${kr(v)}</b></div>`).join('')}</div>` : ''}
    ${D.trips.length ? `<h2>${t('stats.trips')}</h2><div class="card">${D.trips.map(tr => { const s = tripStats(tr); return `<div class="list-row"><div class="l">${esc(tr.name)}<small>${s.cov !== null ? fmtNum(Math.round(s.cov), 0) + '% ' + t('covered') : ''}</small></div><b class="${s.profit >= 0 ? 'pos' : 'neg'}">${signed(s.profit)}</b></div>`; }).join('')}</div>` : ''}
    <h2>${t('stats.best')}</h2><div class="card">${best.map(x => `<div class="list-row" data-a="openItem" data-id="${x.it.id}"><div class="l">${esc(x.it.name)}<small>${x.s.d} · ${pct(roi(x.p, x.b))}</small></div><b class="pos">${signed(x.p)}</b></div>`).join('')}</div>`;
}

/* ---------- settings ---------- */
function viewMore(){
  const approx = !D.ratesAt;
  const rateRows = CURS.filter(c => c !== 'NOK').map(c => `<div class="list-row"><div class="l">1 ${c}<small>${fmtNum(D.rates[c] || 0, 4)} kr</small></div>
    <input data-rate="${c}" inputmode="decimal" style="width:110px" placeholder="${fmtNum(D.rates[c] || 0, 4)}" value="${esc(D.manual[c] || '')}"></div>`).join('');
  const listEditor = (arr, kind, nameFn) => arr.map(x => `<div class="list-row"><div class="l">${esc(nameFn(x.id))}</div>
    <button class="btn small" data-a="rename" data-id="${kind}|${x.id}">${t('rename')}</button>${kind === 'purposes' && x.id === 'reinvest' ? '' : `<button class="x" data-a="delEntry" data-id="${kind}|${x.id}">✕</button>`}</div>`).join('');
  const android = window.MarginGoAndroid;
  let ver = '';
  try { ver = android ? android.getVersion() : 'web'; } catch(e){}
  const canUpdate = android && (() => { try { return android.canSelfUpdate(); } catch(e){ return true; } })();
  return `<h2>${t('set.lang')}</h2>
    <div class="seg">${['sr','en','nb'].map(l => `<button data-a="lang" data-id="${l}" class="${D.lang === l ? 'on' : ''}">${I18N[l]['app.lang']}</button>`).join('')}</div>
    <h2>${t('set.colors')}</h2>
    <div class="card"><div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
      <div><label>${t('set.orange')}</label><input data-th="0" inputmode="numeric" value="${D.th[0]}"></div>
      <div><label>${t('set.yellow')}</label><input data-th="1" inputmode="numeric" value="${D.th[1]}"></div>
      <div><label>${t('set.green')}</label><input data-th="2" inputmode="numeric" value="${D.th[2]}"></div>
    </div><p class="hint">${esc(t('set.colorsHint'))}</p></div>
    <h2>${t('set.cats')}</h2>
    <div class="card">${listEditor(D.cats, 'cats', catName)}
      <div class="tools" style="margin:10px 0 0"><input id="newCat" placeholder="${esc(t('set.newCat'))}"><button class="btn small" data-a="addEntry" data-id="cats">+</button></div></div>
    <h2>${t('set.purposes')}</h2>
    <div class="card">${listEditor(D.purposes, 'purposes', purposeName)}
      <div class="tools" style="margin:10px 0 0"><input id="newPurposes" placeholder="${esc(t('set.newPurpose'))}"><button class="btn small" data-a="addEntry" data-id="purposes">+</button></div></div>
    <h2>${t('set.rates')}</h2>
    <div class="card"><p class="hint" style="margin-top:0">${esc(t('set.ratesHint'))}</p>
      <p class="hint">${t('set.ratesAt')}: ${approx ? esc(t('set.approx')) : new Date(D.ratesAt).toLocaleString(LOCALE[D.lang])}</p>
      ${rateRows}<div class="sp"></div><button class="btn small" data-a="refreshRates">${t('set.refresh')}</button></div>
    <h2>${t('set.backup')}</h2>
    <div class="card"><p class="hint" style="margin-top:0">${esc(t('set.backupHint'))}</p><div class="sp"></div>
      <div class="row"><button class="btn" data-a="export">${t('set.export')}</button><button class="btn" data-a="import">${t('set.import')}</button></div>
      <div class="sp"></div><button class="btn small" data-a="csv">${t('set.csv')}</button></div>
    ${canUpdate ? `<div class="sp"></div><button class="btn" data-a="checkUpdate" style="width:100%">${t('set.updates')}</button>` : ''}
    <p class="hint" style="text-align:center;margin:18px 0">${esc(t('set.about'))}<br>${t('set.version')}: ${esc(ver)}</p>`;
}

/* ================= sheet, toast ================= */
function openSheet(html){
  const s = document.getElementById('sheet');
  s.innerHTML = html; s.scrollTop = 0;
  s.classList.add('open'); document.getElementById('veil').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('veil').classList.remove('open');
}
function sheetOpen(){ return document.getElementById('sheet').classList.contains('open'); }
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', 2600);
}

/* ================= actions ================= */
const ACT = {
  tab: id => { D.ui.tab = id; save(); closeSheet(); render(); window.scrollTo(0, 0); },
  scope: id => { D.ui.scope = id; save(); render(); },
  filter: id => { D.ui.filter = id; save(); render(); },
  newItem: () => D.ui.tab === 'trips' ? tripForm() : itemForm(null, D.ui.scope === 'trip' && D.trips.length ? {tripId:latestTrip().id} : null),
  newItemTrip: id => itemForm(null, {tripId:id}),
  openItem: id => openItem(id),
  editItem: id => itemForm(byId(D.items, id)),
  setSt: arg => { const [id, st] = arg.split('|'); const it = byId(D.items, id); setStatus(it, st); save(); render(); openItem(id); },
  sell: arg => sellForm(arg.split('|')[0], false),
  writeoff: id => sellForm(id, true),
  delSale: arg => {
    const [id, sid] = arg.split('|'), it = byId(D.items, id);
    if(!confirm(t('confirmSale'))) return;
    it.sales = it.sales.filter(s => s.id !== sid); refreshStatus(it); save(); render(); openItem(id);
  },
  delItem: id => {
    const it = byId(D.items, id);
    if(!confirm(t('confirmDelete', {n:it.name}))) return;
    D.items = D.items.filter(x => x.id !== id); save(); closeSheet(); render();
  },
  newTrip: () => tripForm(),
  openTrip: id => openTrip(id),
  editTrip: id => tripForm(byId(D.trips, id)),
  delTrip: id => {
    const tr = byId(D.trips, id);
    if(!confirm(t('delete') + ': ' + tr.name + '?')) return;
    D.trips = D.trips.filter(x => x.id !== id);
    for(const it of D.items) if(it.tripId === id) it.tripId = '';
    save(); closeSheet(); render();
  },
  withdraw: () => moneyForm('withdraw'),
  capIn: () => moneyForm('capIn'),
  capOut: () => moneyForm('capOut'),
  delLedger: id => { if(!confirm(t('delete') + '?')) return; D.ledger = D.ledger.filter(e => e.id !== id); save(); render(); },
  closeSheet: () => closeSheet(),
  lang: id => { D.lang = id; save(); render(); },
  rename: arg => {
    const [kind, id] = arg.split('|'), x = byId(D[kind], id);
    const cur = kind === 'cats' ? catName(id) : purposeName(id);
    const n = prompt(t('newName'), cur);
    if(n && n.trim()){ delete x.key; x.name = n.trim(); save(); render(); }
  },
  delEntry: arg => {
    const [kind, id] = arg.split('|');
    const used = kind === 'cats' ? D.items.some(i => i.cat === id) : D.ledger.some(e => e.p === id);
    if(used && !confirm(t('set.inUse'))) return;
    D[kind] = D[kind].filter(x => x.id !== id);
    save(); render();
  },
  addEntry: kind => {
    const el = document.getElementById(kind === 'cats' ? 'newCat' : 'newPurposes');
    const n = el.value.trim(); if(!n) return;
    D[kind].push({id:uid(), name:n}); save(); render();
  },
  refreshRates: () => fetchRates(true),
  export: () => {
    const data = Object.assign({}, D, {app:'MarginGo', exported:new Date().toISOString()});
    saveFile(`margingo-backup-${today()}.json`, 'application/json', JSON.stringify(data, null, 1));
  },
  import: () => document.getElementById('importFile').click(),
  csv: () => {
    const rows = [['date','item','category','trip','qty','price','currency','price_kr','cost_kr','fees_kr','profit_kr','return_pct','write_off']];
    for(const it of D.items) for(const s of it.sales){
      const p = saleProfit(it, s), b = saleBase(it, s), tr = tripOf(it);
      rows.push([s.d, it.name, catName(it.cat), tr ? tr.name : '', s.qty, s.price, s.cur, s.nok.toFixed(2), (s.qty * unitBase(it)).toFixed(2), (s.fee || 0).toFixed(2), p.toFixed(2), b > 0 ? (p / b * 100).toFixed(1) : '', s.w ? 'yes' : '']);
    }
    rows.sort((a, b) => a === rows[0] ? -1 : b === rows[0] ? 1 : a[0].localeCompare(b[0]));
    const csv = rows.map(r => r.map(v => /[",;\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n');
    saveFile(`margingo-sales-${today()}.csv`, 'text/csv', '﻿' + csv);
  },
  checkUpdate: () => { try { window.MarginGoAndroid.checkForUpdate(); } catch(e){} }
};
function latestTrip(){ return D.trips.slice().sort((a, b) => (b.d1 || '').localeCompare(a.d1 || ''))[0]; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(!el) return;
  if(el.tagName === 'A') return;
  const fn = ACT[el.dataset.a];
  if(fn){ e.preventDefault(); fn(el.dataset.id); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'q'){ D.ui.q = el.value; save(); document.getElementById('itemList').innerHTML = itemListHtml(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'sort'){ D.ui.sort = el.value; save(); render(); }
  else if(el.id === 'catF'){ D.ui.cat = el.value; save(); render(); }
  else if(el.dataset.th !== undefined){
    const th = D.th.slice(); th[+el.dataset.th] = num(el.value);
    if(th[0] <= th[1] && th[1] <= th[2]){ D.th = th; save(); }
    render();
  } else if(el.dataset.rate){
    const v = num(el.value);
    if(v > 0) D.manual[el.dataset.rate] = v; else delete D.manual[el.dataset.rate];
    save(); render();
  } else if(el.id === 'importFile' && el.files[0]){
    const r = new FileReader();
    r.onload = () => {
      let d;
      try { d = JSON.parse(r.result); } catch(_){}
      if(!d || d.app !== 'MarginGo' || !Array.isArray(d.items)){ toast(t('set.importBad')); return; }
      if(!confirm(t('set.importConfirm'))) return;
      D = normalize(d); save(); render(); toast(t('set.importOk'));
    };
    r.readAsText(el.files[0]);
    el.value = '';
  }
});

function saveFile(name, mime, text){
  if(window.MarginGoAndroid){ window.MarginGoAndroid.saveFile(name, mime, text); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ================= exchange rates ================= */
const RATE_INTERVAL = 12 * 3600 * 1000;
async function fetchRates(manual){
  if(!manual && Date.now() - D.ratesAt < RATE_INTERVAL) return;
  const sources = [
    async () => { const j = await (await fetch('https://open.er-api.com/v6/latest/NOK', {cache:'no-store'})).json(); return c => j.rates[c]; },
    async () => { const j = await (await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/nok.json', {cache:'no-store'})).json(); return c => j.nok[c.toLowerCase()]; }
  ];
  for(const src of sources){
    try {
      const per = await src(), rates = {NOK:1};
      for(const c of CURS) if(c !== 'NOK'){ const v = +per(c); if(v > 0) rates[c] = 1 / v; }
      if(Object.keys(rates).length < 4) continue;
      Object.assign(D.rates, rates); D.ratesAt = Date.now(); save();
      if(manual) toast(t('set.ratesOk'));
      render();
      return;
    } catch(e){}
  }
  if(manual) toast(t('set.ratesFail'));
}

/* ================= Android hooks ================= */
// Text shared from another app (a Finn/KP listing): open a new item with the link filled in.
window.mgShared = text => {
  const m = String(text).match(/https?:\/\/\S+/);
  const link = m ? m[0].replace(/[)\].,]+$/, '') : '';
  let name = String(text).replace(link, '').split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
  name = name.replace(/\s*[-–|]\s*(FINN|finn\.no|KupujemProdajem).*$/i, '').slice(0, 120);
  D.ui.tab = 'items'; render();
  itemForm(null, {name, link});
  toast(t('shared'));
};
// Back button: close an open sheet first.
window.mgBack = () => { if(sheetOpen()){ closeSheet(); return true; } if(D.ui.tab !== 'items'){ ACT.tab('items'); return true; } return false; };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheetOpen()) closeSheet(); });

render();
fetchRates(false);
try { window.MarginGoAndroid && window.MarginGoAndroid.ready(); } catch(e){}
if('serviceWorker' in navigator && location.protocol === 'https:' && !window.MarginGoAndroid){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
